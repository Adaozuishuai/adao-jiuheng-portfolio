server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jiuheng.vip www.jiuheng.vip 62.234.111.123 _;

    location = /.well-known/pki-validation/fileauth.txt {
        alias /var/www/jiuheng-validation/.well-known/pki-validation/fileauth.txt;
        default_type text/plain;
    }

    location / {
        return 301 https://jiuheng.vip$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jiuheng.vip;

    ssl_certificate /etc/letsencrypt/live/jiuheng.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiuheng.vip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://jiuheng.vip$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name jiuheng.vip;
    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/jiuheng.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiuheng.vip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
